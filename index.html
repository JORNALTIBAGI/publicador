<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Publicador JK Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f3f5fb;--card:#fff;--line:#e7eaf3;--line2:#d9deeb;
  --ink:#0f1733;--ink2:#2a3352;--muted:#6b7393;--dim:#a3a9c2;
  --blue:#2f5bff;--blue2:#1d3fe0;--soft:#eef2ff;
  --feed:#2f5bff;--carrossel:#8b5cf6;--story:#f43f8e;
  --s-rascunho:#94a3b8;--s-aguardando:#f59e0b;--s-ajustes:#ef4444;--s-aprovado:#16a34a;--s-publicado:#0ea5e9;
  --sh:0 1px 2px rgba(15,23,51,.04),0 4px 14px rgba(15,23,51,.05);
  --r:14px;--cg:linear-gradient(135deg,#8200a8,#c026d3);--on:#fff;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;font-size:14px;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
aside{background:#fff;border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;padding:0 8px 18px;cursor:pointer}
.logo .mk{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#2f5bff,#7c4dff);display:grid;place-items:center;color:#fff;box-shadow:0 6px 14px rgba(47,91,255,.35)}
.logo .mk.img,.av.img{background:#fff!important;border:1px solid var(--line);box-shadow:none;overflow:hidden}
.logo .mk img,.av img{width:100%;height:100%;object-fit:contain;display:block}
.p-top .logo .mk img{width:100%;height:100%;object-fit:contain}
.lgbox{display:flex;align-items:center;gap:12px;border:1.5px dashed var(--line2);border-radius:12px;padding:10px;cursor:pointer}
.lgbox:hover{border-color:var(--blue)}
.lgbox .pv{width:56px;height:56px;border-radius:12px;background:#f3f5fb;display:grid;place-items:center;overflow:hidden;flex:none;color:var(--dim);font-size:11px}
.lgbox .pv img{width:100%;height:100%;object-fit:contain}
.lgbox b{display:block;font-size:13px}.lgbox span{font-size:12px;color:var(--muted)}
.p-logo{width:22mm;height:22mm;border-radius:4mm;border:1px solid var(--line);overflow:hidden;float:right;background:#fff}
.p-logo img{width:100%;height:100%;object-fit:contain}
.hero{position:relative;overflow:hidden;border-radius:16px;padding:20px 24px;margin-bottom:16px;display:flex;align-items:center;gap:18px;background:var(--cg);color:var(--on);box-shadow:0 10px 30px rgba(15,23,51,.12)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.12);pointer-events:none}
.hero::before{width:260px;height:260px;right:-60px;top:-120px}.hero::after{width:180px;height:180px;right:120px;bottom:-120px;background:rgba(255,255,255,.08)}
.hero .hl{width:64px;height:64px;border-radius:16px;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none;font-weight:800;font-size:20px;color:var(--ink);box-shadow:0 6px 16px rgba(0,0,0,.15)}
.hero .hl img{width:100%;height:100%;object-fit:contain;padding:6px}
.hero .hk{font-size:11px;font-weight:700;letter-spacing:.12em;opacity:.8}
.hero .hn{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.hero .hh{font-size:13px;opacity:.85;margin-top:2px}
.hero .hs{margin-left:auto;display:flex;gap:10px;position:relative;z-index:1}
.hero .hs div{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);border-radius:12px;padding:8px 14px;text-align:center;backdrop-filter:blur(4px)}
.hero .hs b{display:block;font-size:20px;font-weight:800}.hero .hs span{font-size:11px;opacity:.85}
.gbar{height:42px;border-radius:10px;background:var(--g);display:flex;align-items:center;padding:0 12px;font-weight:700;font-size:13px;color:var(--gon)}
.grow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.grow input[type=color]{width:44px;height:34px;padding:2px;border-radius:8px;cursor:pointer}
.p-hero{border-radius:4mm;padding:7mm 8mm;background:var(--cg);color:var(--on);display:flex;align-items:center;gap:6mm;margin-bottom:6mm}
.p-hero .pl{width:22mm;height:22mm;border-radius:4mm;background:#fff;overflow:hidden;display:grid;place-items:center;flex:none;color:var(--ink);font-weight:800;font-size:16px}
.p-hero .pl img{width:100%;height:100%;object-fit:contain;padding:1.5mm}
.p-hero .k{font-size:8px;font-weight:800;letter-spacing:.14em;opacity:.85}
.p-hero .n{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.p-hero .s{font-size:10.5px;opacity:.9}
.wk{display:flex;gap:5px;flex-wrap:wrap}
.wk button{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:5px 9px;font-size:12px;font-weight:700;color:var(--muted)}
.wk button.on{background:var(--cg);color:var(--on);border-color:transparent}
.tgrid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tgrid2 label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;font-weight:700;color:var(--muted)}
.box{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:#fafbff}
.box>b{font-size:13px}
.besth{font-size:12px;color:var(--muted);margin:-4px 0 10px;display:flex;align-items:center;gap:6px}
.besth b{color:var(--ink)}
.besth button{border:none;background:var(--soft);color:var(--blue);font-weight:700;font-size:11.5px;border-radius:6px;padding:3px 8px}
.ai{background:linear-gradient(135deg,#7c4dff,#2f5bff)!important;color:#fff!important;border-color:transparent!important}
.ai[disabled]{opacity:.6;cursor:wait}
.gen textarea{background:repeating-linear-gradient(90deg,#f4f1ff 0 20px,#fff 20px 40px);background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-80px 0}}
.hint{font-size:12px;color:var(--muted);line-height:1.5}
.hint a{color:var(--blue)}
.hero .ht{font-size:12px;opacity:.9;margin-top:6px;display:flex;gap:10px;flex-wrap:wrap}
.hero .ht span{background:rgba(255,255,255,.16);border-radius:6px;padding:2px 8px}
.pubbar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;margin-bottom:12px;font-size:13px;font-weight:600}
.pubbar.on{background:#ecfdf3;color:#166534;border:1px solid #bbf7d0}
.pubbar.off{background:#fff;color:var(--muted);border:1px dashed var(--line2)}
.pubbar .dot{width:9px;height:9px;border-radius:50%;background:#16a34a;box-shadow:0 0 0 4px rgba(22,163,74,.15);animation:pl 1.6s infinite}
@keyframes pl{50%{box-shadow:0 0 0 7px rgba(22,163,74,.05)}}
.pubok{font-size:12.5px;color:#166534;background:#ecfdf3;border-radius:8px;padding:8px 10px;margin-top:8px}
.puberr{font-size:12.5px;color:#991b1b;background:#fef2f2;border-radius:8px;padding:8px 10px;margin-top:8px}
.acc{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.acc img{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#eee}
.acc .t{flex:1;min-width:0}.acc .t b{display:block;font-size:13px}.acc .t span{font-size:11.5px;color:var(--muted)}
.steps{margin:0;padding-left:18px;font-size:12.5px;color:var(--ink2);line-height:1.6}
.steps code{background:var(--bg);padding:1px 5px;border-radius:5px;font-size:11.5px}
.fg{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mchoice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mchoice button{border:1.5px solid var(--line2);background:#fff;border-radius:12px;padding:14px;text-align:left}
.mchoice button:hover{border-color:var(--blue)}
.mchoice button.rec{border-color:var(--blue);box-shadow:0 0 0 3px var(--soft)}
.mchoice b{display:block;font-size:15px;text-transform:capitalize}.mchoice span{font-size:12px;color:var(--muted)}
.gate{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:radial-gradient(800px 400px at 80% 0,rgba(130,0,168,.18),transparent),radial-gradient(600px 400px at 0 100%,rgba(192,38,211,.12),transparent),var(--bg)}
.gate.open{display:grid}
.gate .box2{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 30px 60px rgba(15,23,51,.12);padding:30px;width:min(400px,92vw);display:flex;flex-direction:column;gap:14px}
.gate img{width:64px;height:64px;object-fit:contain;align-self:center}
.gate h2{margin:0;text-align:center;font-size:20px}
.gate p{margin:0;text-align:center;color:var(--muted);font-size:13px}
.gate input{width:100%}
.gate .err{color:var(--s-ajustes);font-size:12.5px;text-align:center;min-height:16px}
.sync{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;padding:0 8px}
.sync i{width:7px;height:7px;border-radius:50%;background:#16a34a}
.logo .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:none;background:none;color:var(--muted);font-weight:600;text-align:left;width:100%}
.nav:hover{background:var(--bg);color:var(--ink)}
.nav.active{background:var(--cg);color:var(--on);box-shadow:0 6px 14px rgba(47,91,255,.3)}
.sec-t{font-size:11px;font-weight:700;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;padding:18px 12px 6px}
.cli{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;border:1px solid transparent;background:none;width:100%;text-align:left}
.cli:hover{background:var(--bg)}
.cli.active{background:var(--soft);border-color:#dfe6ff}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;flex:none}
.cli .t{min-width:0;flex:1}
.cli .t b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cli .t span{font-size:11.5px;color:var(--muted)}
.cli .ed{opacity:0;color:var(--muted);padding:2px 4px;border-radius:6px}
.cli:hover .ed{opacity:1}.cli .ed:hover{background:#fff}
.addcli{margin:4px 0 0;border:1.5px dashed var(--line2);background:none;border-radius:10px;padding:9px;color:var(--muted);font-weight:600;font-size:13px}
.addcli:hover{border-color:var(--blue);color:var(--blue)}
.bk{margin-top:auto;border-radius:14px;padding:16px;color:#fff;background:radial-gradient(120px 80px at 100% 100%,rgba(124,77,255,.6),transparent),linear-gradient(150deg,#101a4a,#0b1236)}
.bk b{display:block;font-size:14px;margin-bottom:4px}
.bk p{margin:0 0 12px;font-size:12px;color:#b8c0e6}
.bk .r{display:flex;gap:6px}
.bk button{flex:1;border:none;border-radius:8px;padding:8px;font-size:12px;font-weight:700}
.bk .a{background:var(--blue);color:#fff}.bk .b{background:rgba(255,255,255,.12);color:#fff}

main{padding:22px 28px 60px;min-width:0}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.top h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em}
.top .sub{color:var(--muted);font-size:13px;margin-top:2px}
.top .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:#fff;border-radius:10px;padding:9px 14px;font-weight:600;font-size:13px;color:var(--ink2);transition:.15s}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.pri{background:var(--cg);border-color:transparent;color:var(--on);box-shadow:0 6px 16px rgba(47,91,255,.28)}
.btn.pri:hover{filter:brightness(1.08);color:var(--on)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn.danger{color:var(--s-ajustes)}.btn.danger:hover{border-color:var(--s-ajustes)}
.btn.ghost{border-color:transparent;background:none}
.mnav{display:flex;align-items:center;background:#fff;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.mnav button{border:none;background:none;padding:8px 11px;color:var(--muted)}
.mnav button:hover{color:var(--blue);background:var(--soft)}
.mnav span{font-weight:700;min-width:140px;text-align:center;text-transform:capitalize}

.view{display:none}.view.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.kpi{padding:16px 18px;display:flex;align-items:center;gap:12px}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi .ic{margin-left:auto;width:42px;height:42px;border-radius:12px;display:grid;place-items:center}
.ring{margin-left:auto}

.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:#fff;border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip i{width:8px;height:8px;border-radius:50%}
.flabel{font-size:12px;color:var(--dim);font-weight:700}

.calwrap{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:16px;align-items:start}
.cal{padding:14px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dow{font-size:11.5px;font-weight:700;color:var(--muted);padding:2px 6px 8px;text-transform:uppercase;letter-spacing:.05em}
.cell{border:1px solid var(--line);border-radius:10px;padding:7px;min-height:132px;display:flex;flex-direction:column;gap:5px;cursor:pointer;transition:.12s;min-width:0;background:#fff}
.cell:hover{border-color:#bfcBff;box-shadow:0 4px 14px rgba(47,91,255,.08)}
.cell.out{background:#fafbfe}.cell.out .num{color:var(--dim)}
.cell.today{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.cell.drag{border-color:var(--blue);background:var(--soft);box-shadow:0 0 0 2px rgba(47,91,255,.25)}
.chead{display:flex;align-items:center;gap:6px;min-width:0}
.num{font-weight:700;font-size:12.5px;color:var(--ink2)}
.cell.today .num{background:var(--blue);color:#fff;border-radius:6px;padding:1px 6px}
.hol{font-size:10.5px;font-weight:600;color:#c2410c;background:#fff4ec;border-radius:5px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plist{display:flex;flex-direction:column;gap:4px}
.pc{display:flex;align-items:center;gap:6px;border-radius:7px;padding:3px;background:var(--bg);border-left:3px solid var(--k);min-width:0}
.pc:hover{background:#e9edf9}
.pc.dim{opacity:.25}
.pc .th{position:relative;width:26px;height:32px;border-radius:4px;overflow:hidden;background:#dfe3ef;flex:none}
.pc.story .th{width:20px;height:34px}
.pc .th img,.pc .th video{width:100%;height:100%;object-fit:cover;display:block}
.pc .th .n{position:absolute;right:1px;bottom:1px;background:rgba(15,23,51,.8);color:#fff;font-size:8.5px;font-weight:700;border-radius:3px;padding:0 3px}
.pc .tx{min-width:0;flex:1;line-height:1.15}
.pc .tx b{display:block;font-size:11px;color:var(--k)}
.pc .tx span{font-size:10.5px;color:var(--muted)}
.pc .sd{width:8px;height:8px;border-radius:50%;flex:none;margin-right:2px}
.more{font-size:11px;color:var(--muted);font-weight:600;padding-left:4px}
.add-hint{margin:auto;color:var(--dim);font-size:11px;opacity:0;transition:.12s}
.cell:hover .add-hint{opacity:1}

.tray{padding:14px;position:sticky;top:16px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;gap:10px}
.tray h3{margin:0;font-size:14px;font-weight:800}
.tray .s{font-size:12px;color:var(--muted);margin-top:-6px}
.drop{border:1.5px dashed var(--line2);border-radius:12px;padding:16px;text-align:center;color:var(--muted);font-size:12.5px;background:#fafbff;cursor:pointer;transition:.12s}
.drop:hover,.drop.drag{border-color:var(--blue);background:var(--soft);color:var(--blue)}
.drop b{display:block;color:var(--ink);font-size:13.5px;margin:4px 0 2px}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;overflow:auto;padding-right:2px}
.tm{position:relative;aspect-ratio:4/5;border-radius:8px;overflow:hidden;background:#e6e9f2;cursor:grab;border:1px solid var(--line)}
.tm img,.tm video{width:100%;height:100%;object-fit:cover;display:block}
.tm .k{position:absolute;left:3px;bottom:3px;font-size:9px;font-weight:700;color:#fff;border-radius:4px;padding:1px 4px}
.tempty{font-size:12px;color:var(--dim);text-align:center;padding:10px}

/* artes */
.lib-top{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:16px}
.bigdrop{padding:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:170px}
.bigdrop .ic{width:46px;height:46px;border-radius:12px;background:var(--soft);color:var(--blue);display:grid;place-items:center;margin-bottom:4px}
.check{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink2);font-weight:600}
.check input{width:16px;height:16px;accent-color:var(--blue)}
.howto{padding:18px}
.howto h3{margin:0 0 6px;font-size:14px}
.howto p{margin:0 0 10px;color:var(--muted);font-size:12.5px;line-height:1.5}
.howto code{display:block;font-family:ui-monospace,Consolas,monospace;font-size:12px;background:var(--bg);border-radius:8px;padding:10px 12px;line-height:1.7;color:var(--ink2)}
.bulk{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 14px;margin-bottom:12px;background:var(--ink);color:#fff;border-radius:12px}
.bulk select,.bulk input{background:#fff;color:var(--ink)}
.bulk .btn{border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff}
.bulk .btn.pri{background:var(--blue);border-color:var(--blue)}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.li{position:relative;padding:8px;cursor:pointer;transition:.12s}
.li:hover{border-color:#bfcbff}
.li.sel{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue)}
.li .im{aspect-ratio:1;border-radius:9px;overflow:hidden;background:#eef0f6;display:grid;place-items:center}
.li .im img,.li .im video{max-width:100%;max-height:100%;object-fit:contain;display:block}
.li .nm{font-size:12px;font-weight:600;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .mt{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:4px;margin-top:2px}
.li .ok{color:var(--s-aprovado);font-weight:700}
.li .ck{position:absolute;top:14px;left:14px;width:20px;height:20px;border-radius:6px;background:#fff;border:1.5px solid var(--line2);display:grid;place-items:center;color:#fff;font-size:12px}
.li.sel .ck{background:var(--blue);border-color:var(--blue)}

/* briefing */
.brief{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;align-items:start}
.md{padding:28px 32px;line-height:1.65;color:var(--ink2)}
.md h1{font-size:24px;margin:0 0 14px;color:var(--ink);letter-spacing:-.02em}
.md h2{font-size:17px;margin:24px 0 8px;color:var(--ink);padding-bottom:6px;border-bottom:1px solid var(--line)}
.md h3{font-size:14.5px;margin:18px 0 6px;color:var(--ink)}
.md ul,.md ol{padding-left:20px;margin:6px 0}
.md p{margin:8px 0}
.md blockquote{margin:10px 0;padding:8px 14px;border-left:3px solid var(--blue);background:var(--soft);border-radius:0 8px 8px 0}
.md a{color:var(--blue)}
.md hr{border:none;border-top:1px solid var(--line);margin:18px 0}
.md code{background:var(--bg);padding:1px 5px;border-radius:5px}
.bside{padding:18px;display:flex;flex-direction:column;gap:10px}
.bside .row{display:flex;justify-content:space-between;font-size:13px;border-bottom:1px dashed var(--line);padding-bottom:8px}
.bside .row span{color:var(--muted)}
.empty{padding:40px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}

/* ideias */
.ideas{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
.ilist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.idea{padding:16px;display:flex;flex-direction:column;gap:10px}
.idea p{margin:0;white-space:pre-wrap;line-height:1.45}
.idea .mt{font-size:11.5px;color:var(--dim)}
.idea .acts{display:flex;gap:6px;flex-wrap:wrap}

/* forms */
input,select,textarea{font:inherit;font-size:13.5px;border:1px solid var(--line2);border-radius:9px;padding:8px 10px;background:#fff;color:var(--ink);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,91,255,.12)}
textarea{width:100%;min-height:120px;resize:vertical;line-height:1.45}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:var(--muted)}

/* drawer */
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(540px,100vw);background:var(--bg);border-left:1px solid var(--line);box-shadow:-20px 0 50px rgba(15,23,51,.12);transform:translateX(105%);transition:transform .22s;z-index:10;display:flex;flex-direction:column}
.drawer.open{transform:none}
.dh{padding:18px 22px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.dh h3{margin:0;font-size:17px;font-weight:800}
.db{padding:16px 22px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:14px}
.df{padding:14px 22px;background:#fff;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.df span{font-size:12px;font-weight:700;color:var(--muted);margin-right:4px}
.ps{padding:16px;border-left:4px solid var(--k)}
.ps-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.kb{font-size:12px;font-weight:800;color:#fff;background:var(--k);border-radius:6px;padding:3px 9px}
.ps-h select{padding:5px 8px;font-size:12.5px}
.ps-h .sp{flex:1}
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;border-radius:10px;min-height:120px;align-items:flex-start}
.strip.drag{background:var(--soft);outline:2px dashed var(--blue)}
.mi{position:relative;flex:none;width:96px;aspect-ratio:4/5;border-radius:9px;overflow:hidden;background:#e6e9f2;border:1px solid var(--line)}
.story .mi{width:70px;aspect-ratio:9/16}
.mi img,.mi video{width:100%;height:100%;object-fit:cover;display:block}
.mi .o{position:absolute;left:4px;top:4px;background:rgba(15,23,51,.8);color:#fff;font-size:10px;font-weight:800;border-radius:5px;padding:1px 6px}
.mi .ctr{position:absolute;inset:auto 0 0 0;display:flex;justify-content:space-between;padding:3px;background:linear-gradient(transparent,rgba(15,23,51,.7));opacity:0;transition:.12s}
.mi:hover .ctr{opacity:1}
.mi .ctr button{border:none;background:#fff;border-radius:5px;width:22px;height:20px;font-size:12px;font-weight:800;padding:0;line-height:1}
.addm{flex:none;width:96px;aspect-ratio:4/5;border:1.5px dashed var(--line2);border-radius:9px;background:#fafbff;color:var(--muted);font-size:12px;font-weight:600;display:grid;place-items:center;text-align:center;padding:4px}
.story .addm{width:70px;aspect-ratio:9/16}
.addm:hover{border-color:var(--blue);color:var(--blue)}
.cnt-note{font-size:11.5px;color:var(--muted);margin-bottom:8px}
.frow{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin:6px 0 10px}
.frow input,.frow select{width:100%}
.count{font-size:11px;color:var(--dim);text-align:right}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.notes{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.notes .lb{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
.note{font-size:12.5px;padding:5px 0;display:flex;gap:8px;border-bottom:1px dashed var(--line)}
.note time{color:var(--dim);font-size:11px;flex:none;padding-top:1px}
.nadd{display:flex;gap:6px;margin-top:8px}.nadd input{flex:1}
.dempty{text-align:center;color:var(--muted);padding:30px 10px}

/* modal / toast */
.mbg{position:fixed;inset:0;background:rgba(15,23,51,.4);backdrop-filter:blur(2px);display:none;place-items:center;z-index:20}
.mbg.open{display:grid}
.modal{background:#fff;border-radius:16px;padding:22px;width:min(460px,92vw);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 60px rgba(15,23,51,.2)}
.modal.wide{width:min(760px,94vw)}
.modal h3{margin:0;font-size:17px;font-weight:800}
.modal .foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.colors{display:flex;gap:8px}
.colors button{width:26px;height:26px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line2)}
.colors button.on{box-shadow:0 0 0 2px var(--ink)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;max-height:50vh;overflow:auto}
.pg{position:relative;aspect-ratio:4/5;border-radius:9px;overflow:hidden;border:2px solid transparent;background:#eef0f6;cursor:pointer}
.pg.sel{border-color:var(--blue)}
.pg img,.pg video{width:100%;height:100%;object-fit:cover;display:block}
.pg .u{position:absolute;left:4px;top:4px;font-size:9.5px;font-weight:700;background:rgba(255,255,255,.9);border-radius:4px;padding:1px 5px}
.pg .o{position:absolute;right:4px;top:4px;background:var(--blue);color:#fff;font-size:11px;font-weight:800;border-radius:50%;width:20px;height:20px;display:grid;place-items:center}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;transition:.2s;background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;z-index:30;font-weight:600;font-size:13px;pointer-events:none;box-shadow:0 10px 30px rgba(15,23,51,.25)}
.toast.show{opacity:1;transform:translateX(-50%)}

@media (max-width:1200px){.calwrap{grid-template-columns:1fr}.tray{position:static;max-height:none}.tgrid{grid-template-columns:repeat(6,1fr)}.kpis{grid-template-columns:repeat(2,1fr)}.lib-top,.brief,.ideas{grid-template-columns:1fr}}
@media (max-width:820px){.app{grid-template-columns:1fr}aside{position:static;height:auto}}

let sb=null,UID=null,CFG=null,clients=[],media=new Map(),posts=new Map(),ideas=[],settings={key:'settings',studio:'JK Studio',lastBackup:null};
let cur={cid:null,y:0,m:0,view:'cal'},openDate=null,kindF='all',statusF='all',libF='unused',libSel=new Set();
const urlCache=new Map(),mediaPaths=new Map();
const KIND={clients:'client',posts:'post',media:'media',ideas:'idea',meta:'settings'};
const rowId=(s,v)=>s==='meta'?'settings-'+UID:v.id;
function cleanRow(s,v){if(s==='media'){const {blob,...r}=v;return r;}return v;}
async function put(s,v){const {error}=await sb.from('itens').upsert({id:rowId(s,v),kind:KIND[s],data:cleanRow(s,v)});
  if(error){toast('⚠️ Não salvou: '+error.message);throw error;}}
async function del(s,k){if(s==='media'){const p=mediaPaths.get(k)||(media.get(k)||{}).path;if(p)await sb.storage.from('artes').remove([p]);mediaPaths.delete(k);}
  const {error}=await sb.from('itens').delete().eq('id',s==='meta'?'settings-'+UID:k);if(error)toast('⚠️ '+error.message);}
async function getRows(kind){let all=[],from=0;for(;;){let q=sb.from('itens').select('id,kind,data').range(from,from+999);if(kind)q=q.eq('kind',kind);
  const {data,error}=await q;if(error)throw error;all=all.concat(data);if(data.length<1000)break;from+=1000;}return all;}
async function fn(body){const {data:{session}}=await sb.auth.getSession();if(!session)throw new Error('Sessão expirada. Entre de novo.');
  let r;try{r=await fetch(CFG.url.replace(/\/+$/,'')+'/functions/v1/publicador',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':CFG.key},body:JSON.stringify(body)});}
  catch{throw new Error('Não consegui falar com o robô (função "publicador"). Confira se ela foi publicada no Supabase.');}
  const j=await r.json().catch(()=>({}));if(r.status===404&&!j.error)throw new Error('A função "publicador" não existe no Supabase ainda.');if(!r.ok||j.error)throw new Error(j.error||('Erro '+r.status));return j;}

const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const ymd=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;
const dkey=d=>ymd(d.getFullYear(),d.getMonth(),d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const client=()=>clients.find(c=>c.id===cur.cid);
const mName=(y,m)=>new Date(y,m,1).toLocaleDateString('pt-BR',{month:'long'});
const initials=n=>(n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');
const fmtD=(k,o)=>parse(k).toLocaleDateString('pt-BR',o);
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2400);}

async function prepURL(m){}
function murl(id){const m=media.get(id);if(!m||m.removed)return null;return m.url||null;}
const isVid=id=>{const m=media.get(id);return m&&(m.mime||'').startsWith('video');};
function mtag(id){const u=murl(id);if(!u)return media.get(id)&&media.get(id).removed?'<span style="font-size:9px;color:var(--dim);padding:4px;display:block">arte arquivada</span>':'';return isVid(id)?`<video src="${u}#t=0.1" muted preload="metadata"></video>`:`<img src="${u}" alt="" loading="lazy">`;}
async function copyText(t){try{await navigator.clipboard.writeText(t);}catch{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();}toast('Copiado ✓');}
function download(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);}
const blobURLs=new WeakMap();
function burl(b){if(!b)return null;if(typeof b==='string')return b;let u=blobURLs.get(b);if(!u){u=URL.createObjectURL(b);blobURLs.set(b,u);}return u;}
function avHTML(c,st=''){return c.logo?`<span class="av img" style="${st}"><img onerror="this.remove()" src="${burl(c.logo)}" alt=""></span>`:`<span class="av" style="background:${grad(c).g};color:${grad(c).on};${st}">${esc(initials(c.name))}</span>`;}

function markHTML(){return `<img src="${settings.logo?burl(settings.logo):JK_MARK}" alt="">`;}
function canShow(b){return new Promise(r=>{const i=new Image(),u=burl(b);i.onload=()=>r(i.naturalWidth>0);i.onerror=()=>r(false);i.src=u;});}
function readURL(f){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.onerror=()=>r(null);fr.readAsDataURL(f);});}
async function normLogo(f){let u=await readURL(f);if(!u)return null;if(/\.svg$/i.test(f.name))u=u.replace(/^data:[^;,]*/,'data:image/svg+xml');
  const im=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=u;});if(!im||!(im.naturalWidth||im.width))return null;
  try{const w=im.naturalWidth||512,h=im.naturalHeight||512,k=Math.min(1,512/Math.max(w,h));const cv=document.createElement('canvas');cv.width=Math.round(w*k);cv.height=Math.round(h*k);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);return cv.toDataURL('image/png');}catch{return u;}}
function pickLogo(cb){const i=$('logoIn');i.value='';i.onchange=async()=>{const f=i.files[0];if(!f)return;const u=await normLogo(f);
  if(!u)return toast('Esse arquivo não abre no navegador. Exporte a logo em PNG, JPG ou SVG.');cb(u);};i.click();}
/* cores */
const h2r=h=>{h=(h||'#000').replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');const n=parseInt(h,16)||0;return[n>>16&255,n>>8&255,n&255];};
const r2h=a=>'#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const shade=(h,p)=>r2h(h2r(h).map(v=>p<0?v*(1+p):v+(255-v)*p));
const hexA=(h,a)=>`rgba(${h2r(h).join(',')},${a})`;
const lum=h=>{const [r,g,b]=h2r(h);return(.299*r+.587*g+.114*b)/255;};
const cdist=(a,b)=>{const x=h2r(a),y=h2r(b);return Math.hypot(x[0]-y[0],x[1]-y[1],x[2]-y[2]);};
function grad(c){const c1=c.color||'#2f5bff',c2=c.color2||(lum(c1)<.2?shade(c1,.35):shade(c1,-.35));return{c1,c2,g:`linear-gradient(135deg,${c1} 0%,${c2} 100%)`,on:(lum(c1)+lum(c2))/2>.62?'#0f1733':'#ffffff'};}
function colorsFromMd(md){const out=[];(md.match(/#[0-9a-fA-F]{6}\b/g)||[]).forEach(h=>{h=h.toLowerCase();if(!out.some(o=>cdist(o,h)<40))out.push(h);});return out.slice(0,2);}
async function colorsFromLogo(blob){const ok=await canShow(blob);if(!ok)return[];
  const im=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=burl(blob);});if(!im)return[];
  const cv=document.createElement('canvas');cv.width=cv.height=64;const x=cv.getContext('2d');x.drawImage(im,0,0,64,64);let d;try{d=x.getImageData(0,0,64,64).data;}catch{return[];}
  const bk={};for(let i=0;i<d.length;i+=4){if(d[i+3]<140)continue;const r=d[i],g=d[i+1],b=d[i+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b);
    if(mn>225)continue;const k=(r>>4)+'-'+(g>>4)+'-'+(b>>4);const w=(mx-mn)>40?3:1;const o=bk[k]||(bk[k]={n:0,r:0,g:0,b:0});o.n+=w;o.r+=r*w;o.g+=g*w;o.b+=b*w;}
  const arr=Object.values(bk).sort((a,b)=>b.n-a.n).map(o=>r2h([o.r/o.n,o.g/o.n,o.b/o.n]));const out=[];
  for(const h of arr){if(!out.length||cdist(out[0],h)>90)out.push(h);if(out.length===2)break;}return out;}
function applyTheme(){const c=client();if(!c)return;const {c1,g,on}=grad(c),r=document.documentElement.style;
  r.setProperty('--blue',c1);r.setProperty('--blue2',shade(c1,-.2));r.setProperty('--soft',hexA(c1,.08));r.setProperty('--cg',g);r.setProperty('--on',on);}
function heroHTML(extra=''){const c=client();return `<div class="hl">${c.logo?`<img onerror="this.remove()" src="${burl(c.logo)}">`:esc(initials(c.name))}</div>
  <div style="position:relative;z-index:1;min-width:0"><div class="hk">CLIENTE</div><div class="hn">${esc(c.name)}</div><div class="hh">${esc(c.handle||'')}${extra}</div></div>`;}
function niceName(t){t=t.trim();if(t===t.toUpperCase()&&/[A-ZÀ-Ú]/.test(t)){const small=['da','de','do','das','dos','e','&'];t=t.toLowerCase().split(/\s+/).map((w,i)=>i&&small.includes(w)?w:w.charAt(0).toUpperCase()+w.slice(1)).join(' ');}return t;}
function logoBox(id,blob,title){return `<div class="lgbox" id="${id}"><div class="pv">${blob?`<img src="${burl(blob)}">`:'LOGO'}</div><div style="flex:1"><b>${title}</b><span>${blob?'Clique para trocar':'PNG ou SVG, de preferência com fundo transparente'}</span></div>${blob?`<button type="button" class="btn sm ghost" data-rmlogo>Remover</button>`:''}</div>`;}
const usedMap=()=>{const u=new Map();posts.forEach(p=>p.mediaIds.forEach(id=>{if(!u.has(id))u.set(id,p);}));return u;};

/* ============ datas comemorativas ============ */
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451);return new Date(y,Math.floor((h+l-7*m+114)/31)-1,((h+l-7*m+114)%31)+1);}
function nthDow(y,m,dow,n){const d=new Date(y,m,1);let c=0;for(;;){if(d.getDay()===dow&&++c===n)return d;d.setDate(d.getDate()+1);}}
const holC={};
function holidays(y){if(holC[y])return holC[y];const H={},add=(d,n)=>{const k=dkey(d);H[k]=H[k]?H[k]+' · '+n:n;};
  [[0,1,'Ano Novo'],[2,8,'Dia da Mulher'],[2,15,'Dia do Consumidor'],[3,21,'Tiradentes'],[4,1,'Dia do Trabalhador'],[5,12,'Dia dos Namorados'],[5,24,'São João'],[8,7,'Independência'],[8,15,'Dia do Cliente'],[9,12,'Dia das Crianças'],[9,15,'Dia do Professor'],[10,2,'Finados'],[10,15,'Proclamação da República'],[10,20,'Consciência Negra'],[11,25,'Natal'],[11,31,'Réveillon']].forEach(([m,d,n])=>add(new Date(y,m,d),n));
  const e=easter(y),off=(n,t)=>{const d=new Date(e);d.setDate(d.getDate()+n);add(d,t);};off(-47,'Carnaval');off(-2,'Sexta-feira Santa');off(0,'Páscoa');
  add(nthDow(y,4,0,2),'Dia das Mães');add(nthDow(y,7,0,2),'Dia dos Pais');const bf=nthDow(y,10,4,4);bf.setDate(bf.getDate()+1);add(bf,'Black Friday');
  return holC[y]=H;}

/* ============ render geral ============ */
function render(){renderSide();renderTop();
  if(cur.view==='cal')renderCal();if(cur.view==='lib')renderLib();if(cur.view==='brief')renderBrief();if(cur.view==='ideas')renderIdeas();}
function renderSide(){
  applyTheme();
  $('studioName').textContent=settings.studio;const mk=$('studioMark');mk.innerHTML=markHTML();mk.classList.add('img');
  $('clientList').innerHTML=clients.map(c=>`<button class="cli ${c.id===cur.cid?'active':''}" data-id="${c.id}">
    ${avHTML(c)}
    <span class="t"><b>${esc(c.name)}</b><span>${esc(c.handle||'')}</span></span>
    <span class="ed" data-edit="${c.id}" title="Editar">✎</span></button>`).join('');
  $('lastBackup').textContent='Último backup: '+(settings.lastBackup?new Date(settings.lastBackup).toLocaleDateString('pt-BR'):'nunca');
  document.querySelectorAll('.nav[data-view]').forEach(n=>n.classList.toggle('active',n.dataset.view===cur.view));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id==='view-'+cur.view));
}
function renderTop(){
  const c=client(),T={cal:'Calendário',lib:'Artes',brief:'Briefing',ideas:'Ideias'};
  $('pageTitle').textContent=T[cur.view];
  $('pageSub').textContent=c?`${c.name}${c.handle?' · '+c.handle:''}`:'';
  $('mLabel').textContent=`${mName(cur.y,cur.m)} ${cur.y}`;
  const showM=cur.view==='cal';
  ['waBtn','pdfBtn'].forEach(id=>$(id).style.display=showM?'':'none');$('mnav').style.display=(showM||cur.view==='lib')?'':'none';
}

function monthPosts(cid=cur.cid,y=cur.y,m=cur.m){const pre=`${y}-${pad(m+1)}-`;return [...posts.values()].filter(p=>p.clientId===cid&&p.date.startsWith(pre)).sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));}

/* ============ mídia / upload ============ */
function dims(file){return new Promise(res=>{
  if(file.type.startsWith('video')){const v=document.createElement('video');v.preload='metadata';v.onloadedmetadata=()=>{res({w:v.videoWidth,h:v.videoHeight});URL.revokeObjectURL(v.src);};v.onerror=()=>res({w:9,h:16});v.src=URL.createObjectURL(file);setTimeout(()=>res({w:9,h:16}),4000);}
  else{const im=new Image();im.onload=()=>{res({w:im.naturalWidth,h:im.naturalHeight});URL.revokeObjectURL(im.src);};im.onerror=()=>res({w:4,h:5});im.src=URL.createObjectURL(file);}
});}
function guessKind(m){const n=m.name.toLowerCase();
  if(/stor(y|ies)/.test(n))return'story';if(/carros+el|carousel|carrocel/.test(n))return'carrossel';if(/feed|post/.test(n))return'feed';
  return m.h/m.w>1.6?'story':'feed';}
function dateFromName(n){
  let m=n.match(/(20\d{2})[-_. ](\d{1,2})[-_. ](\d{1,2})/);let y,mo,d;
  if(m){y=+m[1];mo=+m[2];d=+m[3];}
  else{m=n.match(/^(\d{1,2})[-_. ](\d{1,2})(?:[-_. ](20\d{2}))?(?!\d)/);if(!m)return null;d=+m[1];mo=+m[2];y=m[3]?+m[3]:cur.y;
    if(!m[3]){const t=new Date();if(mo-1<t.getMonth()-6)y=t.getFullYear()+1;else y=t.getFullYear();}}
  const dt=new Date(y,mo-1,d);if(dt.getMonth()!==mo-1||dt.getDate()!==d)return null;return dkey(dt);}
async function toJpeg(file){const bmp=await createImageBitmap(file);const k=Math.min(1,1440/bmp.width),cv=document.createElement('canvas');
  cv.width=Math.round(bmp.width*k);cv.height=Math.round(bmp.height*k);const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.drawImage(bmp,0,0,cv.width,cv.height);
  const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',.92));return{blob,w:cv.width,h:cv.height};}
async function uploadMedia(file,meta){const id=meta.id||uid();let blob=file,mime=file.type,w=meta.w,h=meta.h,ext=(file.name||'').split('.').pop()||'bin';
  if(mime.startsWith('image')){const j=await toJpeg(file);blob=j.blob;mime='image/jpeg';w=j.w;h=j.h;ext='jpg';}
  else if(!w){const d=await dims(file);w=d.w;h=d.h;}
  if(blob.size>50*1024*1024)throw new Error(`${file.name||'Arquivo'} passa de 50 MB, limite do plano grátis.`);
  const path=`${UID}/${id}.${ext}`;const {error}=await sb.storage.from('artes').upload(path,blob,{contentType:mime,upsert:true,cacheControl:'31536000'});
  if(error)throw new Error('Envio da arte: '+error.message);
  const url=sb.storage.from('artes').getPublicUrl(path).data.publicUrl;
  const m={...meta,id,mime,w,h,path,url,created:meta.created||Date.now()};delete m.blob;mediaPaths.set(id,path);media.set(id,m);await put('media',m);return m;}
async function addFiles(files){
  const list=[...files].filter(f=>/^(image|video)\//.test(f.type));if(!list.length){toast('Escolha imagens ou vídeos');return[];}
  const out=[];let i=0;for(const f of list){i++;toast(`⬆️ Enviando artes ${i}/${list.length}...`);
    try{out.push(await uploadMedia(f,{clientId:cur.cid,name:f.name}));}catch(e){toast('⚠️ '+e.message);await sleep(1500);}}
  return out;}
async function uploadAuto(files){
  const ms=await addFiles(files);if(!ms.length)return;
  if(autoOn()){await autoPlace(ms);return;}
  let sched=0;
  if(false){
    const groups={};
    for(const m of ms){const d=dateFromName(m.name);if(!d)continue;const k=guessKind(m);const key=k==='carrossel'?`${d}|car`:`${m.id}`;(groups[key]=groups[key]||{d,k,ms:[]}).ms.push(m);}
    for(const g of Object.values(groups)){g.ms.sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
      if(g.k==='carrossel'){const ex=postsOn(g.d).find(p=>p.kind==='carrossel');if(ex){ex.mediaIds.push(...g.ms.map(m=>m.id));await savePost(ex);}else await savePost(newPost(g.d,'carrossel',g.ms.map(m=>m.id)));}
      else await savePost(newPost(g.d,g.k,g.ms.map(m=>m.id)));sched+=g.ms.length;}
  }
  render();toast(`${ms.length} arte(s) enviada(s)${sched?` · ${sched} agendada(s) pelo nome`:''}`);
}
function pickFiles(cb){const i=$('fileIn');i.value='';i.onchange=()=>{if(i.files.length)cb([...i.files]);};i.click();}

/* ============ agenda automática / melhores horários ============ */
const WD=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const isFood=c=>/lanch|dog|hamb[uú]rg|burger|pizz|restaur|a[cç]a[ií]|bar\b|delivery|comida|gastr|padaria|doceria|confeit|sorvet|caf[eé]|espeto|churras|marmit|sushi|pastel|lanche/i.test((c.name||'')+' '+(c.briefing||'').slice(0,3000));
function defaultSched(c){
  if(isFood(c))return{days:[2,4,5,6,0],tFeed:'17:30',tWknd:'18:00',tCar:'11:30',tStory:'11:00',tStory2:'18:30',profile:'food'};
  return{days:[1,2,3,4,5],tFeed:'18:00',tWknd:'11:00',tCar:'12:00',tStory:'09:00',tStory2:'19:00',profile:'geral'};}
const sched=c=>({...defaultSched(c),...(c.sched||{})});
function bestTime(c,kind,date,i=0){const S=sched(c),wd=parse(date).getDay(),we=wd===0||wd===6;
  if(kind==='story')return i%2?S.tStory2:S.tStory;if(kind==='carrossel')return we?S.tWknd:S.tCar;return we?S.tWknd:S.tFeed;}
const byName=(a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true});
function pickDays(days,n,free,pref){if(!n)return[];
  const spread=(arr,k)=>{const o=[];for(let i=0;i<k;i++)o.push(arr[Math.floor((i+.5)*arr.length/k)]);return o;};
  const P=days.filter(d=>free(d)&&pref.includes(parse(d).getDay())),O=days.filter(d=>free(d)&&!pref.includes(parse(d).getDay()));
  let out=P.length>=n?spread(P,n):[...P,...(O.length?spread(O,Math.min(n-P.length,O.length)):[])];
  let i=0;while(out.length<n)out.push(days[(i++*3)%days.length]);return out.sort();}
function daysLeft(y,m){const dim=new Date(y,m+1,0).getDate(),t=new Date();t.setDate(t.getDate()+1);let n=0;for(let d=1;d<=dim;d++)if(ymd(y,m,d)>=dkey(t))n++;return n;}
function chooseMonth(n){return new Promise(res=>{
  const t=new Date(),left=daysLeft(cur.y,cur.m),isNow=cur.y===t.getFullYear()&&cur.m===t.getMonth();
  const nx=new Date(t.getFullYear(),t.getMonth()+1,1);
  if(left===0){cur.y=nx.getFullYear();cur.m=nx.getMonth();while(daysLeft(cur.y,cur.m)===0){cur.m++;if(cur.m>11){cur.m=0;cur.y++;}}return res(true);}
  if(!(isNow&&left<12))return res(true);
  openModal(`<h3>Em qual mês distribuir?</h3><div class="hint">Você está subindo <b>${n} arte(s)</b>. ${mName(cur.y,cur.m)} só tem mais <b>${left} dia(s)</b> livres para postar.</div>
    <div class="mchoice"><button id="mcNow"><b>${mName(cur.y,cur.m)}</b><span>Só os ${left} dias que faltam</span></button>
    <button id="mcNext" class="rec"><b>${mName(nx.getFullYear(),nx.getMonth())}</b><span>Mês inteiro · recomendado</span></button></div>
    <div class="foot"><button class="btn ghost" id="mcCancel">Não distribuir agora</button></div>`);
  $('mcNow').onclick=()=>{closeModal();res(true);};
  $('mcNext').onclick=()=>{cur.y=nx.getFullYear();cur.m=nx.getMonth();closeModal();res(true);};
  $('mcCancel').onclick=()=>{closeModal();res(false);};});}
async function autoPlace(ms,silent){
  if(!ms.length)return 0;if(!(await chooseMonth(ms.length))){render();toast('Artes salvas em "Artes não agendadas"');return 0;}
  const c=client();if(!ms.length)return 0;
  const dim=new Date(cur.y,cur.m+1,0).getDate(),tm=new Date();tm.setDate(tm.getDate()+1);const tk=dkey(tm);
  const days=[];for(let d=1;d<=dim;d++){const k=ymd(cur.y,cur.m,d);if(k>=tk)days.push(k);}
  if(!days.length){toast('Esse mês já passou. Vá para o próximo mês (›) e distribua de novo.');return 0;}
  const stories=ms.filter(m=>guessKind(m)==='story').sort(byName),feeds=ms.filter(m=>guessKind(m)!=='story');
  const groups={},units=[];
  for(const m of feeds){if(guessKind(m)==='carrossel'){const base=m.name.replace(/\.[^.]+$/,'').replace(/[\s_\-.()]*\d+\)?$/,'').toLowerCase();(groups[base]=groups[base]||[]).push(m);}else units.push({kind:'feed',ms:[m],n:m.name});}
  Object.values(groups).forEach(g=>{g.sort(byName);units.push({kind:'carrossel',ms:g.slice(0,MAX_CAR),n:g[0].name});});
  units.sort((a,b)=>a.n.localeCompare(b.n,undefined,{numeric:true}));
  const S=sched(c);
  const fd=pickDays(days,units.length,d=>!postsOn(d).some(p=>p.kind!=='story'),S.days);
  for(let i=0;i<units.length;i++){const u=units[i],p=newPost(fd[i],u.kind,u.ms.map(m=>m.id));p.time=bestTime(c,u.kind,fd[i]);await savePost(p);}
  const sd=pickDays(days,stories.length,d=>!postsOn(d).some(p=>p.kind==='story'),[0,1,2,3,4,5,6]);
  for(let i=0;i<stories.length;i++){const p=newPost(sd[i],'story',[stories[i].id]);p.time=bestTime(c,'story',sd[i],i);await savePost(p);}
  render();if(!silent)toast(`⚡ ${units.length} post(s) e ${stories.length} story(s) distribuídos em ${mName(cur.y,cur.m)}${units.length>days.length?' (alguns dias ficaram com 2 posts)':''}`);
  autoAI();return units.length+stories.length;}
const autoOn=()=>settings.autoPlace!==false;
document.querySelectorAll('.autoPlaceCk').forEach(ck=>{ck.onchange=()=>{settings.autoPlace=ck.checked;saveSettings();document.querySelectorAll('.autoPlaceCk').forEach(x=>x.checked=ck.checked);};});

/* ============ posts ============ */
function newPost(date,kind,mediaIds=[]){return {id:uid(),clientId:cur.cid,date,kind,mediaIds,time:bestTime(client(),kind,date),caption:'',status:'rascunho',notes:[],created:Date.now()};}
async function savePost(p){if(p.kind==='feed'&&p.mediaIds.length>1)p.kind='carrossel';p.dueAt=dueAt(p);posts.set(p.id,p);await put('posts',p);}
async function createFromMedia(date,ms){
  const feeds=ms.filter(m=>guessKind(m)!=='story'),stories=ms.filter(m=>guessKind(m)==='story');
  if(feeds.length>1)await savePost(newPost(date,'carrossel',feeds.map(m=>m.id)));
  else if(feeds.length)await savePost(newPost(date,guessKind(feeds[0]),[feeds[0].id]));
  for(const s of stories)await savePost(newPost(date,'story',[s.id]));
  render();if(openDate===date)renderDrawer();toast(`Agendado para ${fmtD(date,{day:'2-digit',month:'2-digit'})} ✓`);autoAI();
}
async function removePost(id){if(!confirm('Apagar este post? As artes continuam na aba Artes.'))return;posts.delete(id);await del('posts',id);render();renderDrawer();}

const grid=$('grid');
grid.addEventListener('click',e=>{const c=e.target.closest('.cell');if(c)openDrawer(c.dataset.date);});
grid.addEventListener('dragstart',e=>{const p=e.target.closest('.pc');if(p){e.dataTransfer.setData('text/plain','post:'+p.dataset.pid);e.dataTransfer.effectAllowed='move';}});
grid.addEventListener('dragover',e=>{const c=e.target.closest('.cell');if(!c)return;e.preventDefault();grid.querySelectorAll('.cell.drag').forEach(x=>x!==c&&x.classList.remove('drag'));c.classList.add('drag');});
grid.addEventListener('dragleave',e=>{const c=e.target.closest('.cell');if(c&&!c.contains(e.relatedTarget))c.classList.remove('drag');});
grid.addEventListener('drop',async e=>{const c=e.target.closest('.cell');if(!c)return;e.preventDefault();c.classList.remove('drag');const date=c.dataset.date;
  if(e.dataTransfer.files.length){const ms=await addFiles([...e.dataTransfer.files]);if(ms.length)createFromMedia(date,ms);return;}
  const t=e.dataTransfer.getData('text/plain');
  if(t.startsWith('media:')){const m=media.get(t.slice(6));if(m)createFromMedia(date,[m]);}
  if(t.startsWith('post:')){const p=posts.get(t.slice(5));if(p&&p.date!==date){p.date=date;await savePost(p);render();toast('Post movido para '+fmtD(date,{day:'2-digit',month:'2-digit'})+' ✓');}}
});
$('tray').addEventListener('dragstart',e=>{const t=e.target.closest('.tm');if(t)e.dataTransfer.setData('text/plain','media:'+t.dataset.mid);});

  el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('drag');});el.addEventListener('dragleave',()=>el.classList.remove('drag'));
  el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('drag');if(e.dataTransfer.files.length)onFiles([...e.dataTransfer.files]);});}

async function gpost(path,params){let r;try{r=await fetch(GV+path,{method:'POST',body:new URLSearchParams(params)});}catch{throw new Error('Não consegui falar com o Facebook. Abra o Publicador direto no Chrome (endereço começando com file:///) e pause bloqueadores de anúncio nesta página.');}const j=await r.json().catch(()=>({}));if(!r.ok||j.error)throw new Error('Instagram: '+((j.error&&(j.error.error_user_msg||j.error.message))||r.status));return j;}

async function toJpegB64(id){const u=murl(id);const im=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=u;});if(!im)throw new Error('Não consegui abrir a arte.');

      if(p.status!=='aprovado'||pubBusy.has(p.id))continue;const c=clients.find(x=>x.id===p.clientId);if(!igOf(c))continue;

      if(now-due>cfg.lateHours*3600e3){if(!p.lateWarned){p.lateWarned=true;p.notes.push({t:now,text:'⏰ O horário passou com o computador desligado. Publique manualmente ou mude o horário.'});await savePost(p);render();}continue;}
      if((p.pubTries||0)>=3)continue;if(p.pubLast&&now-p.pubLast<5*60e3)continue;
      await runPublish(p,false);}
  }finally{tickRunning=false;}}

function md2html(src){
  const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*(?!\s)(.+?)\*/g,'$1<i>$2</i>').replace(/`(.+?)`/g,'<code>$1</code>').replace(/\[(.+?)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank">$1</a>');
  const lines=src.replace(/\r/g,'').split('\n');let h='',list=null,para=[];
  const flushP=()=>{if(para.length){h+=`<p>${para.map(inl).join('<br>')}</p>`;para=[];}};
  const flushL=()=>{if(list){h+=`</${list}>`;list=null;}};
  for(const l of lines){let m;
    if(/^\s*$/.test(l)){flushP();flushL();continue;}
    if(m=l.match(/^(#{1,3})\s+(.*)/)){flushP();flushL();h+=`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`;continue;}
    if(/^\s*(---|\*\*\*)\s*$/.test(l)){flushP();flushL();h+='<hr>';continue;}
    if(m=l.match(/^>\s?(.*)/)){flushP();flushL();h+=`<blockquote>${inl(m[1])}</blockquote>`;continue;}
    if(m=l.match(/^\s*[-*+]\s+(.*)/)){flushP();if(list!=='ul'){flushL();h+='<ul>';list='ul';}h+=`<li>${inl(m[1])}</li>`;continue;}
    if(m=l.match(/^\s*\d+[.)]\s+(.*)/)){flushP();if(list!=='ol'){flushL();h+='<ol>';list='ol';}h+=`<li>${inl(m[1])}</li>`;continue;}
    flushL();para.push(l);}
  flushP();flushL();return h;}
function briefField(md,label){const m=md.match(new RegExp(`^\\s*[-*]?\\s*\\**${label}\\**\\s*:\\s*(.+)$`,'im'));return m?m[1].trim():'';}
function briefTitle(md){for(const l of ['Nome da empresa','Empresa','Marca','Nome fantasia']){const v=briefField(md,l);if(v)return niceName(v.replace(/\*\*/g,''));}
  const m=md.match(/^#\s+(.+)$/m);if(!m)return'';let t=m[1].replace(/\*\*/g,'').replace(/^(briefing|manual|documento)[^—–\-|:]*[—–\-|:]\s*/i,'');t=t.split(/\s+[—–|:]\s+|\s+-\s+/)[0];return niceName(t);}

    <div class="foot">${isNew?'':'<button class="btn danger" id="cDel" style="margin-right:auto">Excluir</button>'}<button class="btn ghost" id="cCancel">Cancelar</button><button class="btn pri" id="cSave">Salvar</button></div>`);

  const readS=()=>{['tFeed','tWknd','tCar','tStory','tStory2'].forEach(k=>S[k]=$(k).value||S[k]);};
  const sync=()=>{c.name=$('cName').value.trim();c.handle=$('cHandle').value.trim();c.phone=$('cPhone').value;c.examples=$('cEx').value;readS();c.sched={...S};};
  drawS();$('cDays').onclick=e=>{const b=e.target.closest('[data-d]');if(!b)return;readS();const d=+b.dataset.d;S.days=S.days.includes(d)?S.days.filter(x=>x!==d):[...S.days,d];if(!S.days.length)S.days=[d];drawS();};
  $('tReset').onclick=()=>{sync();const keep=c.sched;c.sched=null;S=defaultSched(c);c.sched=keep;drawS();toast(S.profile==='food'?'Horários de alimentação aplicados':'Horários recomendados aplicados');};
  if(focus==='sched')setTimeout(()=>$('schedBox').scrollIntoView({block:'center'}),80);
  $('cMd').onclick=()=>pickMd((t,name)=>{sync();c.briefing=t;c.briefingName=name;fillFromBrief(c,t,true);$('cName').value=c.name;$('cHandle').value=c.handle;$('cPhone').value=c.phone;$('cMdT').textContent=name;paint();toast('Briefing carregado ✓');});
  const paint=()=>{const g=grad(c);$('gC1').value=g.c1;$('gC2').value=g.c2;$('gPrev').style.setProperty('--g',g.g);$('gPrev').style.setProperty('--gon',g.on);$('gPrev').textContent=($('cName').value||'Prévia do gradiente');};
  $('gC1').oninput=e=>{c.color=e.target.value;c.gradSet=true;paint();};$('gC2').oninput=e=>{c.color2=e.target.value;c.gradSet=true;paint();};
  $('gSwap').onclick=()=>{const g=grad(c);c.color=g.c2;c.color2=g.c1;c.gradSet=true;paint();};
  $('gLogo').onclick=async()=>{if(!c.logo)return toast('Suba a logo primeiro');const cs=await colorsFromLogo(c.logo);if(!cs.length)return toast('Não consegui ler as cores da logo');c.color=cs[0];c.color2=cs[1]||'';c.gradSet=true;paint();toast('Cores tiradas da logo ✓');};
  $('gMd').onclick=()=>{const cs=colorsFromMd(c.briefing||'');if(!cs.length)return toast('O briefing não tem cores em #hex (ex.: #E91E63)');c.color=cs[0];c.color2=cs[1]||'';c.gradSet=true;paint();toast('Cores tiradas do briefing ✓');};
  $('cName').addEventListener('input',paint);setTimeout(paint,0);
  const wireLogo=()=>{$('cLogo').onclick=e=>{if(e.target.closest('[data-rmlogo]')){c.logo=null;$('cLogoW').innerHTML=logoBox('cLogo',null,'Logo da empresa');wireLogo();return;}
    pickLogo(async f=>{c.logo=f;$('cLogoW').innerHTML=logoBox('cLogo',f,'Logo da empresa');wireLogo();
      if(!c.gradSet&&!colorsFromMd(c.briefing||'').length){const cs=await colorsFromLogo(f);if(cs.length){c.color=cs[0];c.color2=cs[1]||'';paint();toast('Gradiente criado a partir da logo ✓');}}});};};wireLogo();
  $('cTpl').onclick=e=>{e.preventDefault();download('modelo-briefing.md',new Blob([BRIEF_TEMPLATE],{type:'text/markdown'}));};
  $('cColors').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;c.color=b.dataset.c;c.color2='';c.gradSet=true;paint();};
  $('cCancel').onclick=closeModal;
  $('cSave').onclick=async()=>{sync();if(!c.name)return toast('Dê um nome à empresa');if(c.handle&&!c.handle.startsWith('@'))c.handle='@'+c.handle;c.phone=c.phone.replace(/\D/g,'');
    await put('clients',c);const i=clients.findIndex(x=>x.id===c.id);if(i>-1)clients[i]=c;else clients.push(c);if(isNew)cur.cid=c.id;closeModal();saveSettings();render();};
  if(!isNew)$('cDel').onclick=async()=>{if(clients.length<=1)return toast('Precisa ter pelo menos 1 cliente');if(!confirm(`Excluir ${c.name} com todos os posts, artes e ideias?`))return;
    for(const p of [...posts.values()].filter(p=>p.clientId===c.id)){posts.delete(p.id);await del('posts',p.id);}
    for(const m of [...media.values()].filter(m=>m.clientId===c.id)){media.delete(m.id);await del('media',m.id);}
    for(const i of ideas.filter(i=>i.clientId===c.id))await del('ideas',i.id);ideas=ideas.filter(i=>i.clientId!==c.id);
    await del('clients',c.id);clients=clients.filter(x=>x.id!==c.id);if(cur.cid===c.id)cur.cid=clients[0].id;closeModal();saveSettings();render();};
  setTimeout(()=>$('cName').focus(),50);
}
$('logo').onclick=()=>{let lg=settings.logo||null;
  openModal(`<h3>Seu estúdio</h3><div id="sLogoW">${logoBox('sLogo',lg,'Logo do estúdio')}</div><label class="f">Nome (aparece no menu e no PDF)<input id="sName" value="${esc(settings.studio)}"></label><div class="foot"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn pri" id="sSave">Salvar</button></div>`);
  const w=()=>{$('sLogo').onclick=e=>{if(e.target.closest('[data-rmlogo]')){lg=null;$('sLogoW').innerHTML=logoBox('sLogo',null,'Logo do estúdio');w();return;}pickLogo(f=>{lg=f;$('sLogoW').innerHTML=logoBox('sLogo',f,'Logo do estúdio');w();});};};w();
  $('sSave').onclick=()=>{settings.studio=$('sName').value.trim()||'JK Studio';settings.logo=lg;saveSettings();renderSide();closeModal();};};
function openModal(h,wide){$('modal').innerHTML=h;$('modal').classList.toggle('wide',!!wide);$('mbg').classList.add('open');}
function closeModal(){$('mbg').classList.remove('open');}
$('mbg').addEventListener('mousedown',e=>{if(e.target===$('mbg'))closeModal();});
async function saveSettings(){settings.lastClient=cur.cid;await put('meta',settings);}

/* ============ ideias ============ */
function renderIdeas(){const list=ideas.filter(i=>i.clientId===cur.cid).sort((a,b)=>b.created-a.created);
  $('ideaList').innerHTML=list.length?list.map(i=>`<div class="card idea" data-id="${i.id}"><p>${esc(i.text)}</p><div class="mt">${new Date(i.created).toLocaleDateString('pt-BR')}</div>
    <div class="acts"><input type="date" data-date><select data-kind><option value="feed">Feed</option><option value="carrossel">Carrossel</option><option value="story">Story</option></select><button class="btn sm pri" data-act="use">Levar p/ o dia</button><button class="btn sm danger" data-act="del">✕</button></div></div>`).join('')
    :'<div class="card empty" style="grid-column:1/-1"><b>Nenhuma ideia salva</b>Anote aqui ideias de posts para este cliente.</div>';}
$('ideaAdd').onclick=async()=>{const t=$('ideaText').value.trim();if(!t)return;const i={id:uid(),clientId:cur.cid,text:t,created:Date.now()};ideas.push(i);await put('ideas',i);$('ideaText').value='';renderIdeas();toast('Ideia salva ✓');};
$('ideaList').onclick=async e=>{const a=e.target.closest('[data-act]');if(!a)return;const card=a.closest('.idea'),i=ideas.find(x=>x.id===card.dataset.id);
  if(a.dataset.act==='del'){if(!confirm('Apagar ideia?'))return;ideas=ideas.filter(x=>x!==i);await del('ideas',i.id);renderIdeas();}
  if(a.dataset.act==='use'){const d=card.querySelector('[data-date]').value;if(!d)return toast('Escolha a data');const p=newPost(d,card.querySelector('[data-kind]').value);p.caption=i.text;await savePost(p);
    ideas=ideas.filter(x=>x!==i);await del('ideas',i.id);const dt=parse(d);cur.y=dt.getFullYear();cur.m=dt.getMonth();cur.view='cal';render();openDrawer(d);toast('Ideia virou post ✓');}};

/* ============ PDF ============ */
$('pdfBtn').onclick=async()=>{
  const c=client(),{y,m}=cur,mp=monthPosts();if(!mp.length)return toast('Nenhum post neste mês');
  const H=holidays(y),off=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate(),total=Math.ceil((off+dim)/7)*7,mn=mName(y,m);
  const img=id=>id&&!isVid(id)?`<img src="${murl(id)}">`:'';
  const top=`<div class="p-top"><div class="logo"><span class="mk img">${markHTML()}</span>${esc(settings.studio)}</div><small>Planejamento de conteúdo · ${mn} ${y}</small></div>`;
  let cal='';for(let i=0;i<total;i++){const d=new Date(y,m,1-off+i),k=dkey(d),out=d.getMonth()!==m,ps=out?[]:postsOn(k);
    cal+=`<div class="p-c ${out?'out':''}"><div class="d"><span>${d.getDate()}</span>${!out&&H[k]?`<em>${esc(H[k])}</em>`:''}</div><div class="th">${ps.slice(0,4).map(p=>`<div class="${p.kind==='story'?'st':'fe'}" style="--k:${KC(p.kind)}">${img(p.mediaIds[0])}${p.mediaIds.length>1?`<i>${p.mediaIds.length}</i>`:''}</div>`).join('')}</div></div>`;}
  const n=k=>mp.filter(p=>p.kind===k).length;
  let h=`<div class="p-cover">${top}<div class="p-hero"><div class="pl">${c.logo?`<img onerror="this.remove()" src="${burl(c.logo)}">`:esc(initials(c.name))}</div><div><div class="k">PLANEJAMENTO DE CONTEÚDO</div><div class="n">${esc(c.name)}</div><div class="s">${esc(c.handle||'')} · ${mn} de ${y}</div></div></div>
    <div class="p-stats"><div class="p-st"><b style="color:${KC('feed')}">${n('feed')}</b><span>Feed</span></div><div class="p-st"><b style="color:${KC('carrossel')}">${n('carrossel')}</b><span>Carrosséis</span></div><div class="p-st"><b style="color:${KC('story')}">${n('story')}</b><span>Stories</span></div><div class="p-st"><b>${new Set(mp.map(p=>p.date)).size}</b><span>Dias com conteúdo</span></div></div>
    <div class="p-cal">${DOW.map(d=>`<div class="p-dow">${d}</div>`).join('')}${cal}</div>
    <div class="p-leg"><span><i style="background:${KC('feed')}"></i>Feed</span><span><i style="background:${KC('carrossel')}"></i>Carrossel</span><span><i style="background:${KC('story')}"></i>Story</span><span>Detalhes e legendas nas próximas páginas</span></div></div>`;
  h+=top+mp.map(p=>{const [f,...rest]=p.mediaIds;return `<div class="p-card ${p.kind==='story'?'st':'fe'}" style="--k:${KC(p.kind)}">
    <div class="md1"><div class="main">${img(f)}</div>${rest.length?`<div class="rest">${rest.map(img).join('')}</div>`:''}</div>
    <div class="tx"><div class="dt">${esc(fmtD(p.date,{weekday:'long',day:'2-digit',month:'2-digit'}))}</div>${H[p.date]?`<div class="hl">${esc(H[p.date])}</div>`:''}
      <span class="bd">${KINDS[p.kind].l}${p.mediaIds.length>1?` · ${p.mediaIds.length} ${p.kind==='story'?'telas':'imagens'}`:''} · ${esc(p.time||'')}</span>
      ${p.caption?`<div class="cap">${esc(p.caption)}</div>`:''}
      <div class="ap">[   ] Aprovado      [   ] Ajustar: ______________________________</div></div></div>`;}).join('');
  $('print').innerHTML=h;
  await Promise.all([...$('print').querySelectorAll('img')].map(i=>i.decode().catch(()=>{})));
  if(document.fonts)await document.fonts.ready;
  const old=document.title;document.title=`${c.name} - ${mn} ${y}`;window.print();document.title=old;};

/* ============ WhatsApp ============ */
$('waBtn').onclick=()=>{const c=client(),mp=monthPosts();if(!mp.length)return toast('Nenhum post neste mês');
  const by={};mp.forEach(p=>(by[p.date]=by[p.date]||[]).push(p));
  let t=`Olá! Segue o planejamento de *${mName(cur.y,cur.m)}* para ${c.name} 🗓️\n`;
  Object.keys(by).sort().forEach(k=>{t+=`\n*${fmtD(k,{day:'2-digit',month:'2-digit'})} (${fmtD(k,{weekday:'short'}).replace('.','')})*\n`;
    by[k].forEach(p=>{const cap=(p.caption||'').replace(/\s+/g,' ').trim();t+=`• ${KINDS[p.kind].l}${p.mediaIds.length>1?` (${p.mediaIds.length})`:''} ${p.time||''}${cap?' — '+(cap.length>70?cap.slice(0,70)+'…':cap):''}\n`;});});
  t+=`\nO PDF com as artes vai em anexo. Pode responder *APROVADO* ou me dizer o que ajustar 🙂`;
  openModal(`<h3>Mensagem de aprovação</h3><textarea id="waT" style="min-height:280px">${esc(t)}</textarea>
    <label class="check"><input type="checkbox" id="waMark" checked> Marcar rascunhos do mês como "Aguardando aprovação"</label>
    <div style="font-size:12px;color:var(--muted)">Dica: gere o PDF antes e anexe na conversa.</div>
    <div class="foot"><button class="btn" id="waCopy">Copiar</button><button class="btn pri" id="waOpen">Abrir WhatsApp ↗</button></div>`,true);
  const mark=async()=>{if(!$('waMark').checked)return;for(const p of mp)if(p.status==='rascunho'){p.status='aguardando';await savePost(p);}render();};
  $('waCopy').onclick=async()=>{await copyText($('waT').value);await mark();};
  $('waOpen').onclick=async()=>{const txt=$('waT').value;await mark();const ph=(c.phone||'').replace(/\D/g,'');window.open(`https://wa.me/${ph?(ph.startsWith('55')?ph:'55'+ph):''}?text=${encodeURIComponent(txt)}`,'_blank');closeModal();};};

/* ============ backup ============ */
const toURL=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b);});
function fromURL(u){const [h,d]=u.split(','),mime=h.match(/:(.*?);/)[1],bin=atob(d),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:mime});}
$('exportBtn').onclick=async()=>{toast('Gerando backup...');settings.lastClient=cur.cid;settings.lastBackup=Date.now();
  const out={app:'calendario-posts',version:3,settings,clients,ideas,posts:[...posts.values()],media:[...media.values()]};
  const t=new Date();download(`backup-publicador-${dkey(t)}.json`,new Blob([JSON.stringify(out)],{type:'application/json'}));
  await saveSettings();renderSide();toast('Backup salvo ✓ (as artes ficam guardadas online)');};
$('importBtn').onclick=()=>{$('importFile').value='';$('importFile').click();};
$('importFile').onchange=async()=>{const f=$('importFile').files[0];if(!f)return;let d;
  try{d=JSON.parse(await f.text());if(d.app!=='calendario-posts'||!d.clients)throw 0;}catch{return toast('Arquivo de backup inválido');}
  if(!confirm('Importar este backup para o Publicador online? Itens iguais serão substituídos.'))return;
  try{const fl=x=>typeof x==='string'&&x.startsWith('data:')?x:null;
    for(const c of clients){if(/^Cliente \d$/.test(c.name)&&![...posts.values()].some(p=>p.clientId===c.id)&&![...media.values()].some(m=>m.clientId===c.id)&&!d.clients.some(x=>x.id===c.id)){await del('clients',c.id);}}
    let i=0;const ms=d.media||[];
    for(const m of ms){i++;toast(`⬆️ Enviando artes ${i}/${ms.length}...`);
      if(typeof m.blob==='string'&&m.blob.startsWith('data:')){const b=fromURL(m.blob);try{await uploadMedia(new File([b],m.name||'arte',{type:b.type}),{...m,blob:undefined});}catch(e){toast('⚠️ '+e.message);}}
      else if(m.url)await put('media',m);}
    for(const c of d.clients)await put('clients',{...c,logo:fl(c.logo)});for(const x of d.ideas||[])await put('ideas',x);
    for(const p of d.posts){p.dueAt=dueAt(p);await put('posts',p);}
    if(d.settings){const keep={ai:settings.ai,pub:settings.pub};await put('meta',{...d.settings,...keep,logo:fl(d.settings.logo),key:'settings'});}
    await load();if(d.clients[0]&&!d.clients.some(c=>c.id===cur.cid))cur.cid=d.clients[0].id;render();toast('Backup importado ✓');}
  catch(e){toast('⚠️ Importação parou: '+(e.message||e));}};

/* ============ início ============ */
async function load(){
  const rows=await getRows();clients=[];ideas=[];posts=new Map();media=new Map();mediaPaths.clear();let s=null;
  for(const r of rows){const v=r.data;if(r.kind==='client')clients.push(v);else if(r.kind==='idea')ideas.push(v);else if(r.kind==='post')posts.set(v.id,v);
    else if(r.kind==='media'){media.set(v.id,v);if(v.path)mediaPaths.set(v.id,v.path);}else if(r.kind==='settings')s=v;}
  clients.sort((a,b)=>(a.created||0)-(b.created||0)||a.name.localeCompare(b.name));
  if(s)settings=s;if(!settings.studio||settings.studio==='Meu Studio')settings.studio='JK Studio';
  if(!clients.length){clients=[{id:uid(),name:'Cliente 1',handle:'@cliente1',phone:'',color:COLORS[0],briefing:'',briefingName:'',created:Date.now()}];for(const c of clients)await put('clients',c);}
  cur.cid=clients.some(c=>c.id===settings.lastClient)?settings.lastClient:clients[0].id;}
async function refreshPosts(){if(!sb||!UID||openDate||$('mbg').classList.contains('open')||document.hidden)return;
  try{const rows=await getRows('post');const n=new Map(rows.map(r=>[r.data.id,r.data]));
    if(JSON.stringify([...n.values()].map(p=>[p.id,p.status,p.caption,p.date,p.time,(p.notes||[]).length]))!==JSON.stringify([...posts.values()].map(p=>[p.id,p.status,p.caption,p.date,p.time,(p.notes||[]).length]))){posts=n;render();}}catch{}}
setInterval(refreshPosts,60000);window.addEventListener('focus',refreshPosts);

/* ============ configuração e login ============ */
function readCfg(){const c=window.PJK_CONFIG||{};if(c.url&&c.key)return c;try{return JSON.parse(localStorage.getItem('pjk_cfg')||'null');}catch{return null;}}
function gate(html){$('gateBox').innerHTML=`<img src="${JK_MARK}" alt="">`+html;$('gate').classList.add('open');}
function setupScreen(err){gate(`<h2>Configurar o Publicador</h2><p>Cole os dados do seu projeto do Supabase<br>(Project Settings → API Keys / Data API).</p>
  <label class="f">Project URL<input id="gUrl" placeholder="https://xxxxx.supabase.co"></label>
  <label class="f">Publishable key (chave pública)<input id="gKey" placeholder="sb_publishable_..."></label>
  <div class="err">${esc(err||'')}</div><button class="btn pri" id="gGo" style="justify-content:center">Salvar</button>`);
  $('gGo').onclick=()=>{const url=$('gUrl').value.trim(),key=$('gKey').value.trim();if(!/^https:\/\/.+\.supabase\.co\/?$/.test(url)||!key)return setupScreen('Confira o endereço e a chave.');
    try{localStorage.setItem('pjk_cfg',JSON.stringify({url,key}));}catch{}location.reload();};}
function loginScreen(err){gate(`<h2>Publicador JK Studio</h2><p>Entre com o e-mail e a senha criados no Supabase.</p>
  <label class="f">E-mail<input id="gMail" type="email" autocomplete="username"></label>
  <label class="f">Senha<input id="gPass" type="password" autocomplete="current-password"></label>
  <div class="err" id="gErr">${esc(err||'')}</div><button class="btn pri" id="gGo" style="justify-content:center">Entrar</button>
  <a href="#" id="gCfg" style="font-size:12px;color:var(--muted);text-align:center">Trocar projeto do Supabase</a>`);
  const go=async()=>{$('gGo').textContent='Entrando...';const {error}=await sb.auth.signInWithPassword({email:$('gMail').value.trim(),password:$('gPass').value});
    if(error){$('gGo').textContent='Entrar';$('gErr').textContent=/invalid/i.test(error.message)?'E-mail ou senha incorretos.':error.message;return;}location.reload();};
  $('gGo').onclick=go;$('gPass').onkeydown=e=>{if(e.key==='Enter')go();};
  $('gCfg').onclick=e=>{e.preventDefault();try{localStorage.removeItem('pjk_cfg');}catch{}setupScreen();};}
$('logout').onclick=async e=>{e.preventDefault();await sb.auth.signOut();location.reload();};
(async()=>{const t=new Date();cur.y=t.getFullYear();cur.m=t.getMonth();
  CFG=readCfg();if(!CFG)return setupScreen();
  if(!window.supabase)return gate('<h2>Sem internet</h2><p>Não consegui carregar o Publicador. Confira a conexão e recarregue a página.</p>');
  sb=window.supabase.createClient(CFG.url,CFG.key);
  const {data:{session}}=await sb.auth.getSession();if(!session)return loginScreen();
  UID=session.user.id;$('who').textContent='Online · '+(session.user.email||'');
  try{await load();}catch(e){return gate(`<h2>Banco não encontrado</h2><p>${esc(e.message||String(e))}</p><p>Rode o arquivo <b>1-banco.sql</b> no SQL Editor do Supabase e recarregue.</p>`);}
  render();})();
</script>
</body>
